[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdcif"
version = "0.0.1"
description = "Shareable mmCIF objects for MD trajectories: cluster centroids, provenance and per-state essential modes (PDB-IHM compatible)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy",
    "scipy",
    "MDAnalysis>=2.8",
    "scikit-learn>=1.3",
    "ihm>=2.0",
    "gemmi",
    "pyyaml",
    "typer",
]

[project.optional-dependencies]
viz = ["matplotlib", "py3Dmol"]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit", "MDAnalysisTests"]

[project.scripts]
mdcif = "mdcif.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
